[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "supplysec"
version = "1.0.0"
description = "Supply-chain security gate: SBOM, advisory match, license/policy gate, PQC scanner, firmware audit, CI-ready"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "5h4d0wn1k", email = "5h4d0wn1k@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
supplysec = "supplysec.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supplysec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
